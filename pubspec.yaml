name: yourhome
description: A accommodation finder app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  provider: ^6.1.1
  dio: ^5.4.0
  jwt_decoder: ^2.0.1
  intl: ^0.19.0
  image_picker: ^1.0.5
  fluttertoast: ^8.2.4
  connectivity_plus: ^5.0.2
  razorpay_flutter: ^1.3.5
  firebase_messaging: ^14.7.0
  firebase_core: ^2.24.2
  permission_handler: ^11.0.0
  url_launcher: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  video_player: ^2.9.2
  stomp_dart_client: ^3.0.1
  chewie: ^1.8.5
  video_compress: ^3.1.0
  flutter_cache_manager: ^3.3.0
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/